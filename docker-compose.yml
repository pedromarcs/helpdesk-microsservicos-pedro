services:
  usuarios:
    build: ./servico-usuarios
    # TEMPORÁRIO: porta aberta só para testar este serviço sozinho.
    # Quando o gateway existir, estas duas linhas saem
    # (só o gateway pode ficar exposto).
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SEGREDO: ${JWT_SEGREDO:?defina o JWT_SEGREDO no arquivo .env}
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
    volumes:
      - usuarios_dados:/dados      # o banco deste serviço
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  usuarios_dados:
services:
  gateway:
    build: ./gateway
    # A ÚNICA porta publicada do sistema inteiro (só acessível pelo próprio computador)
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      USUARIOS_URL: http://usuarios:8000
      INVENTARIO_URL: http://inventario:8000
      CHAMADOS_URL: http://chamados:8000
    depends_on:
      - usuarios
      - inventario
      - chamados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  usuarios:
    build: ./servico-usuarios
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SEGREDO: ${JWT_SEGREDO:?defina o JWT_SEGREDO no arquivo .env}
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
    volumes:
      - usuarios_dados:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  inventario:
    build: ./servico-inventario
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SEGREDO: ${JWT_SEGREDO:?defina o JWT_SEGREDO no arquivo .env}
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
    volumes:
      - inventario_dados:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  chamados:
    build: ./servico-chamados
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SEGREDO: ${JWT_SEGREDO:?defina o JWT_SEGREDO no arquivo .env}
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
      # Dentro do Docker, os serviços se chamam pelo nome, não por localhost
      USUARIOS_URL: http://usuarios:8000
      INVENTARIO_URL: http://inventario:8000
      TIMEOUT_SERVICOS: "3"
    volumes:
      - chamados_dados:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  usuarios_dados:
  inventario_dados:
  chamados_dados:
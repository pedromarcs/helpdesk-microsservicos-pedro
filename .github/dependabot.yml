version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/servico-usuarios"
      - "/servico-inventario"
      - "/servico-chamados"
      - "/gateway"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - "/servico-usuarios"
      - "/servico-inventario"
      - "/servico-chamados"
      - "/gateway"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly